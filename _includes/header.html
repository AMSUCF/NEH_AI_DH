<header class="site-header">
  <div class="header-content">
    <h1 class="site-title">{{ site.title }}</h1>
    <p class="site-tagline">{{ site.description }}</p>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}" class="nav-link{% if page.url == '/' %} active{% endif %}">Overview</a>
      <a href="{{ '/readings' | relative_url }}" class="nav-link{% if page.url contains 'readings' %} active{% endif %}">Readings</a>
      <a href="{{ '/exercises' | relative_url }}" class="nav-link{% if page.url contains 'exercises' %} active{% endif %}">Exercises</a>
    </nav>
  </div>
</header>
